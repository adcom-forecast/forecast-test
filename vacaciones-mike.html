</head>

const GENERAL = {
  note:"Daniel tiene acceso a todos los repositorios de Mike — cualquier duda técnica adicional se puede resolver desde ahí.",

    {label:"Fuente General ADCOM", sub:"Control de presupuestos", url:"https://docs.google.com/spreadsheets/u/0/d/1jhv8v4r68NIlTdb7NsTkgHHdmfVUuRTBCOdWzJUBJek/edit", ic:"📁"},

  ]
};

const navDaniel = document.getElementById('nav-daniel');
const navEros = document.getElementById('nav-eros');
const cardsContainer = document.getElementById('cards-container');
const topbarTitle = document.getElementById('topbar-title');
const badgeCount = document.getElementById('badge-count');

function buildNavItem(client){
  const btn = document.createElement('button');
  const hasUrgent = client.tasks.some(t=>t.urgent) || client.context.some(c=>c.urgent);
  btn.className = 'nav-item' + (hasUrgent ? ' has-urgent' : '');
  btn.dataset.target = client.id;
  btn.innerHTML = `<span>${client.name}</span><span class="dot"></span>`;
  btn.addEventListener('click', ()=> showClient(client.id));
  return btn;
}

CLIENTS.filter(c => c.responsable.includes('Daniel')).forEach(c => navDaniel.appendChild(buildNavItem(c)));
CLIENTS.filter(c => c.responsable === 'Eros').forEach(c => navEros.appendChild(buildNavItem(c)));

function buildCard(client){
  const div = document.createElement('div');
  div.className = 'client-card';
  div.id = 'card-' + client.id;

  const urgentTasks = client.tasks.filter(t=>t.urgent).length;

  div.innerHTML = `
    <div class="client-head">
      <h2>${client.name}</h2>
      <div class="meta-row">
        <div class="meta-item"><span class="label">Responsable</span><span class="value">${client.responsable}</span></div>
        <div class="meta-item"><span class="label">Ejecutivo/a</span><span class="value">${client.ejecutivo}</span></div>
        ${client.reunion ? `<div class="meta-item"><span class="label">Reunión de tráfico</span><span class="value">${client.reunion}</span></div>` : ''}
      </div>
    </div>

    ${client.context.length ? `
    <div class="section">
      <h3><span class="icon">📌</span> Contexto actual</h3>
      <ul class="ctx-list">
        ${client.context.map(c => `<li class="${c.urgent ? 'urgent' : ''}">${c.text}</li>`).join('')}
      </ul>
    </div>` : ''}

    ${client.tasks.length ? `
    <div class="section">
      <h3><span class="icon">✅</span> Pendientes / a ejecutar</h3>
      <ul class="task-list">
        ${client.tasks.map(t => `<li class="${t.urgent ? 'urgent' : ''}"><span class="chk"></span><span>${t.urgent ? '<span class="tag-urgent">URGENTE</span>' : ''}${t.text}</span></li>`).join('')}
      </ul>
    </div>` : ''}

    ${client.links.length ? `
    <div class="section">
      <h3><span class="icon">🔗</span> Enlaces clave</h3>
      <div class="link-grid">
        ${client.links.map(l => `
          <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
            <span class="ic">${l.ic}</span>
            <span class="txt"><span>${l.label}</span>${l.sub ? `<small>${l.sub}</small>` : ''}</span>
          </a>`).join('')}
      </div>
    </div>` : ''}
  `;
  return div;
}

CLIENTS.forEach(c => cardsContainer.appendChild(buildCard(c)));

          <span class="txt"><span>${l.label}</span><small>${l.sub}</small></span>
        </a>`).join('')}
    </div>
  </div>
  <div class="section">
    <h3><span class="icon">🗝️</span> Nota de acceso</h3>
    <div class="note-box">${GENERAL.note}</div>
  </div>
`;
cardsContainer.appendChild(generalCard);
document.querySelector('.nav-item[data-target="general"]').addEventListener('click', ()=> showClient('general'));

function showClient(id){
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.target === id));
  document.querySelectorAll('.client-card').forEach(el => el.classList.toggle('active', el.id === 'card-' + id));

  if(id === 'general'){
    topbarTitle.textContent = 'General ADCOM';
    badgeCount.textContent = 'Fuentes compartidas';
  } else {
    const client = CLIENTS.find(c => c.id === id);
    topbarTitle.textContent = client.name + ' — cobertura mientras Mike está fuera';
    const urgentCount = client.tasks.filter(t=>t.urgent).length;
    badgeCount.textContent = urgentCount > 0 ? `${urgentCount} pendiente(s) urgente(s)` : 'Sin pendientes urgentes';
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

// abrir la primera cuenta por defecto
showClient(CLIENTS[0].id);
